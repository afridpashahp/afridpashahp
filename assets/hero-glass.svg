<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#17122B"/>
      <stop offset="1" stop-color="#071A2E"/>
    </linearGradient>
    <linearGradient id="glass" x1="250" y1="70" x2="950" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="360" y1="140" x2="840" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B8CFF"/>
      <stop offset="0.5" stop-color="#62D9FF"/>
      <stop offset="1" stop-color="#7EF0C6"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.03"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="180" cy="85" r="150" fill="#7C5CFF" fill-opacity="0.34" filter="url(#blur1)"/>
  <circle cx="1015" cy="335" r="175" fill="#00C2FF" fill-opacity="0.26" filter="url(#blur1)"/>
  <circle cx="920" cy="60" r="110" fill="#58F0C2" fill-opacity="0.14" filter="url(#blur1)"/>
  <rect x="110" y="70" width="980" height="280" rx="32" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.22" filter="url(#shadow)"/>
  <rect x="110" y="70" width="980" height="280" rx="32" fill="#FFFFFF" opacity="0.02" filter="url(#noise)"/>
  <rect x="160" y="118" width="96" height="6" rx="3" fill="url(#accent)"/>
  <text x="160" y="185" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700">Afrid Pasha H P</text>
  <text x="160" y="230" fill="#C9D3E7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26">Software Developer • AI Enthusiast</text>
  <text x="160" y="282" fill="#AAB7D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Java  •  Spring Boot  •  MySQL  •  AI  •  Automation</text>
  <text x="160" y="320" fill="#7FDFF7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Building • Learning • Improving</text>
  <circle cx="1004" cy="156" r="48" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <path d="M985 159L998 172L1026 140" stroke="#7EF0C6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
